13px}.iconbtn{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:8px;padding:8px 10px;cursor:pointer}.avatar{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:700}.content{max-width:1450px;margin:auto;padding:32px 36px 48px}.pagehead{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:25px}.eyebrow{color:var(--accent);font-size:11px;font-weight:700;letter-spacing:1.1px;text-transform:uppercase}h1{font-size:27px;letter-spacing:-.7px;margin:5px 0 5px}h2{font-size:14px;margin:0}.subtitle{font-size:13px;color:var(--muted);margin:0}.button{border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:8px;padding:9px 13px;font-size:12px;font-weight:650;cursor:pointer}.button:hover{filter:brightness(.96)}.button:disabled{opacity:.5;cursor:wait}.button.secondary{color:var(--text);background:var(--surface);border-color:var(--line)}.button.danger{background:var(--surface);border-color:#e8c5c9;color:var(--danger)}.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:20px}.card,.panel{border:1px solid var(--line);background:var(--surface);border-radius:11px;box-shadow:var(--shadow)}.metric{padding:17px 18px}.metric-label{font-size:11px;color:var(--muted);font-weight:600}.metric-value{font-size:26px;font-weight:700;margin:8px 0 4px;letter-spacing:-.5px}.metric-note{font-size:11px;color:var(--muted)}.panel{overflow:hidden}.panel-head{padding:16px 18px;display:flex;align-items:center;justify-content:space-between;gap:14px;border-bottom:1px solid var(--line)}.filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.field,input,select{font:inherit}input,select{border:1px solid var(--line);background:var(--surface);color:var(--text);padding:9px 10px;border-radius:7px;font-size:12px;min-width:0}input:focus,select:focus,button:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 28%,transparent);outline-offset:1px}.filters input{width:210px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;text-align:left;min-width:760px}th{font-size:10px;letter-spacing:.7px;text-transform:uppercase;color:var(--muted);font-weight:650;background:var(--surface2)}th,td{padding:12px 17px;border-bottom:1px solid var(--line)}td{font-size:12px}tr:last-child td{border:0}.person{font-weight:650}.meta{font-size:11px;color:var(--muted);margin-top:3px}.badge{display:inline-flex;border-radius:99px;padding:4px 8px;font-size:10px;font-weight:650;background:var(--accent-soft);color:var(--accent)}.rowactions{display:flex;gap:5px}.smallbtn{padding:6px 8px;font-size:10px}.pagination{padding:12px 16px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:11px}.empty{padding:38px 15px;text-align:center;color:var(--muted);font-size:12px}.notice{display:none;margin:14px 0;padding:10px 12px;border-radius:8px;font-size:12px;background:var(--accent-soft);color:var(--accent)}.notice.error{background:#fff0f1;color:var(--danger)}.orggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}.orgitem{padding:15px}.orgitem strong{font-size:13px}.orgitem p{font-size:11px;color:var(--muted);margin:6px 0 0}.unavailable{padding:28px;border:1px dashed var(--line);border-radius:10px;color:var(--muted);font-size:13px;background:var(--surface)}dialog{width:min(680px,calc(100% - 24px));max-height:92vh;overflow:auto;padding:0;border:1px solid var(--line);border-radius:13px;background:var(--surface);color:var(--text);box-shadow:0 25px 90px #0003}dialog::backdrop{background:#10192488;backdrop-filter:blur(2px)}.modalhead,.modalfoot{padding:15px 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.modalfoot{border-top:1px solid var(--line);border-bottom:0}.formgrid{padding:18px;display:grid;grid-template-columns:1fr 1fr;gap:13px}.field{display:grid;gap:5px}.field label{color:var(--muted);font-size:11px}.field input,.field select{width:100%}.full{grid-column:1/-1}.formerror{color:var(--danger);font-size:12px;min-height:16px;padding:0 18px 10px}.mobile-menu{display:none}.dark{--bg:#111a24;--surface:#182430;--surface2:#1d2b38;--line:#2a3b4a;--text:#e4ebf0;--muted:#9cabb8;--accent:#5bd2ba;--accent-soft:#173b38;--shadow:0 8px 28px #0002;color-scheme:dark}.dark body,.dark{background:var(--bg)}.dark .notice.error{background:#43282e}.dark .button.danger{background:var(--surface);border-color:#74444b}.dark .badge{background:var(--accent-soft)}@media(max-width:900px){.sidebar{width:66px;padding:18px 8px}.brand{padding:0 8px 22px}.brandtext,.nav-label,.nav button span:not(.ico),.sidebar-foot{display:none}.nav button{justify-content:center;padding:11px}.main{margin-left:66px}.content{padding:27px 20px}.topbar{padding:0 20px}}@media(max-width:600px){.sidebar{width:0;padding:0;border:0;overflow:hidden}.sidebar.open{width:230px;padding:16px 12px;border-right:1px solid var(--line)}.sidebar.open .brandtext,.sidebar.open .nav-label,.sidebar.open .nav button span:not(.ico),.sidebar.open .sidebar-foot{display:block}.sidebar.open .nav button{justify-content:flex-start}.main{margin-left:0}.mobile-menu{display:inline-block}.topbar{height:56px;padding:0 14px}.content{padding:22px 13px}.metrics{grid-template-columns:1fr;gap:9px}.metric{padding:13px 15px}.metric-value{font-size:22px}.pagehead{margin-bottom:18px}.panel-head{align-items:flex-start;flex-direction:column}.filters{width:100%}.filters input{flex:1;width:100%}.filters select{flex:1}.formgrid{grid-template-columns:1fr}.full{grid-column:auto}.avatar{display:none}}

<body><section id="loginScreen" style="max-width:420px;margin:12vh auto;padding:28px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)"><div class="eyebrow">LedgerForge</div><h1 style="margin:8px 0">Sign in</h1><p class="subtitle">Use your provisioned LedgerForge account.</p><form id="loginForm" class="formgrid" style="padding:18px 0 0"><div class="field full"><label for="loginUsername">Email</label><input id="loginUsername" type="email" autocomplete="username" required></div><div class="field full"><label for="loginPassword">Password</label><input id="loginPassword" type="password" autocomplete="current-password" required></div><div id="loginError" class="formerror full" role="alert"></div><button id="loginSubmit" class="button full">Sign in</button></form></section><div class="app" id="application" style="display:none"><aside class="sidebar" id="sidebar"><div class="brand"><div class="logo" aria-hidden="true">L</div><div class="brandtext">LedgerForge<small>People operations</small></div></div><div class="nav-label">Workspace</div><nav class="nav" aria-label="Main navigation"><button class="active" data-page="dashboard"><span class="ico">⌂</span><span>Overview</span></button><button data-page="people" data-roles="Admin,HR"><span class="ico">♙</span><span>Employees</span></button><button data-page="organisation" data-roles="Admin,HR"><span class="ico">▦</span><span>Organisation</span></button></nav><div class="nav-label">People operations</div><nav class="nav" aria-label="People operations"><button data-page="salary" data-roles="Admin,HR,Employee"><span class="ico">₹</span><span>Salary history</span></button><button data-page="attendance" data-roles="Admin,HR,Employee"><span class="ico">◷</span><span>Attendance</span></button><button data-page="leave" data-roles="Admin,HR,Employee"><span class="ico">▤</span><span>Leave</span></button><button data-page="payroll" data-roles="Admin,HR"><span class="ico">₹</span><span>Payroll</span></button><button data-page="payslips" data-roles="Admin,HR,Employee"><span class="ico">▧</span><span>Payslips</span></button><button data-page="ledger" data-roles="Admin,HR"><span class="ico">≋</span><span>Ledger</span></button><button data-page="financial-reports" data-roles="Admin,HR"><span class="ico">▤</span><span>Financial reports</span></button></nav><div class="nav-label">Receivables</div><nav class="nav"><button data-page="clients" data-roles="Admin,HR"><span class="ico">♧</span><span>Clients</span></button><button data-page="users" data-roles="Admin"><span class="ico">&#128100;</span><span>Users</span></button><button data-page="invoices" data-roles="Admin,HR"><span class="ico">▤</span><span>Invoices & payments</span></button></nav><div class="sidebar-foot">LedgerForge · Internal workspace<br>Employee data from the live API</div></aside>
<main class="main"><header class="topbar"><div class="righttop"><button class="iconbtn mobile-menu" id="menuBtn" aria-label="Toggle navigation">☰</button><div class="crumb" id="crumb">Workspace / Overview</div></div><div class="righttop"><button class="iconbtn" id="themeBtn" aria-label="Toggle light and dark theme">◐ Theme</button><span id="signedInAs" class="subtitle"></span><button class="iconbtn" id="logoutBtn" type="button">Sign out</button><div class="avatar" aria-label="User">LF</div></div></header><div class="content" id="content" aria-live="polite"></div></main></div>
<dialog id="employeeDialog"><form id="employeeForm"><div class="modalhead"><h2 id="dialogTitle">Add employee</h2><button class="iconbtn" type="button" id="closeDialog" aria-label="Close dialog">×</button></div><div class="formgrid"><div class="field"><label for="employee_id">Employee ID</label><input id="employee_id" name="employee_id" maxlength="20" required></div><div class="field"><label for="hire_date">Hire date</label><input id="hire_date" name="hire_date" type="date" required></div><div class="field"><label for="first_name">First name</label><input id="first_name" name="first_name" maxlength="100" required></div><div class="field"><label for="last_name">Last name</label><input id="last_name" name="last_name" maxlength="100" required></div><div class="field full"><label for="full_name">Display name</label><input id="full_name" name="full_name" maxlength="201" required></div><div class="field"><label for="work_email">Work email</label><input id="work_email" name="work_email" type="email" maxlength="255" required></div><div class="field"><label for="employment_type">Employment type</label><select id="employment_type" name="employment_type"><option>Permanent</option><option>Fixed-Term Contract</option></select></div><div class="field"><label for="employment_status">Status</label><select id="employment_status" name="employment_status"><option>Active</option><option>Contract Ended</option><option>Resigned</option><option>Terminated</option></select></div><div class="field"><label for="department_id">Department</label><select id="department_id" name="department_id" required></select></div><div class="field"><label for="role_id">Role</label><select id="role_id" name="role_id" required></select></div><div class="field"><label for="manager_id">Manager ID (optional)</label><input id="manager_id" name="manager_id" maxlength="20"></div><div class="field"><label for="work_location">Work location</label><input id="work_location" name="work_location" maxlength="100"></div><div class="field"><label for="work_mode">Work mode</label><select id="work_mode" name="work_mode"><option value="">Select…</option><option>Onsite</option><option>Hybrid</option><option>Remote</option></select></div></div><div class="formerror" id="formError" aria-live="polite"></div><div class="modalfoot"><span class="subtitle">Only fields supported by the employee API are shown.</span><button class="button" id="saveEmployee" type="submit">Save employee</button></div></form></dialog>
<script src="/assets/dashboard_sections.js"></script><script>
const API_BASE=(window.LEDGERFORGE_API_BASE||'').replace(/\/$/,''),el=id=>document.getElementById(id),content=el('content');let page='dashboard',offset=0,limit=10,depts=[],roles=[],people=[],mode='create',pageHasNext=false,stats=null;let authUser=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function money(n){return new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',minimumFractionDigits:2,maximumFractionDigits:2}).format(n||0)}
async function request(path,opts={}){const headers=new Headers(opts.headers||{}),token=sessionStorage.getItem('lf_access_token');if(token&&path!='/auth/login')headers.set('Authorization',`Bearer ${token}`);const r=await fetch(API_BASE+path,{...opts,headers});let data=null;try{data=r.status===204?null:await r.json()}catch{}if(r.status===401&&path!='/auth/login'){sessionStorage.removeItem('lf_access_token');authUser=null;showLogin();throw Error('Session expired. Please sign in again.')}if(!r.ok){const d=data?.detail;throw Error(Array.isArray(d)?d.map(x=>x.msg).join(', '):d||`Request failed (${r.status})`)}return data}
function showLogin(){const screen=el('loginScreen'),app=el('application');if(screen)screen.style.display='block';if(app)app.style.display='none';if(el('loginPassword'))el('loginPassword').value=''}
function applyRoleNavigation(){document.querySelectorAll('[data-roles]').forEach(button=>{button.hidden=!button.dataset.roles.split(',').includes(authUser?.role)});el('signedInAs').textContent=`${authUser.username} ? ${authUser.role}`}
async function startDashboard(){const access=sessionStorage.getItem('lf_access_token');if(!access){showLogin();return}try{authUser=await request('/auth/me');el('loginScreen').style.display='none';el('application').style.display='';applyRoleNavigation();if(authUser.role!=='Employee'){await Promise.all([loadOverview(),getRoles().then(r=>roles=r)])}else{stats=null;depts=[]}setPage('dashboard')}catch(error){if(sessionStorage.getItem('lf_access_token')){showLogin();el('loginError').textContent=error.message}}}
el('loginForm').addEventListener('submit',async event=>{event.preventDefault();const button=el('loginSubmit'),error=el('loginError');button.disabled=true;error.textContent='';try{const result=await request('/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:el('loginUsername').value,password:el('loginPassword').value})});sessionStorage.setItem('lf_access_token',result.access_token);await startDashboard()}catch(e){sessionStorage.removeItem('lf_access_token');error.textContent=e.message}finally{button.disabled=false}});
el('logoutBtn').addEventListener('click',()=>{sessionStorage.removeItem('lf_access_token');authUser=null;showLogin()});
function toast(msg,error=false){const n=el('notice');if(!n)return;n.textContent=msg;n.classList.toggle('error',error);n.style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>n.style.display='none',5000)}
function head(kicker,title,sub,action=''){return `<div class="pagehead"><div><div class="eyebrow">${kicker}</div><h1>${title}</h1><p class="subtitle">${sub}</p></div>${action}</div>`}
function setPage(next){page=next;offset=0;document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===next));const labels={dashboard:'Overview',people:'Employees',organisation:'Organisation',salary:'Salary history',attendance:'Attendance',leave:'Leave management',payroll:'Payroll',payslips:'Payslips',ledger:'Accounting ledger','financial-reports':'Financial reports',clients:'Clients',invoices:'Invoices and payments',users:'User administration'};el('crumb').textContent='Workspace / '+(labels[next]||next);render()}
async function loadOverview(){try{const [d,s]=await Promise.all([request('/departments'),request('/employees/stats')]);depts=d;stats=s;return true}catch(e){stats=null;depts=[];toast(`Could not load overview data: ${e.message}`,true);return false}}
async function loadPeople(){const p=new URLSearchParams({limit:limit+1,offset});const search=el('search')?.value.trim(),dept=el('deptFilter')?.value,role=el('roleFilter')?.value;if(search)p.set('search',search);if(dept)p.set('department_id',dept);if(role)p.set('role_id',role);try{const list=await request('/employees?'+p);pageHasNext=list.length>limit;people=list.slice(0,limit);renderPeopleTable()}catch(e){el('peopleRows').innerHTML=`<tr><td class="empty" colspan="6">Could not load employees. ${esc(e.message)}</td></tr>`;el('resultCount').textContent='Directory unavailable';pageHasNext=false}}
function tableRows(list){return list.length?list.map(x=>`<tr><td><div class="person">${esc(x.full_name)}</div><div class="meta">${esc(x.employee_id)} · ${esc(x.work_email)}</div></td><td>${esc(x.department_name||'—')}</td><td>${esc(x.role_title||'—')}<div class="meta">${esc(x.role_id)}</div></td><td>${esc(x.work_location||'—')}</td><td><span class="badge">${esc(x.employment_status)}</span></td><td><div class="rowactions"><button class="button secondary smallbtn" data-action="view" data-id="${esc(x.employee_id)}">View</button><button class="button secondary smallbtn" data-action="edit" data-id="${esc(x.employee_id)}">Edit</button><button class="button danger smallbtn" data-action="delete" data-id="${esc(x.employee_id)}">Depart</button></div></td></tr>`).join(''):'<tr><td class="empty" colspan="6">No employees match these filters.</td></tr>'}
function renderPeopleTable(){const rows=el('peopleRows');if(!rows)return;rows.innerHTML=tableRows(people);el('resultCount').textContent=`${people.length} employee${people.length===1?'':'s'} shown`;el('pageLabel').textContent=`${people.length?`Showing ${offset+1}–${offset+people.length}`:'No results'}${pageHasNext?' · more available':''}`;el('prev').disabled=offset===0;el('next').disabled=!pageHasNext}
function peoplePage(){return `${head('Directory','Employees','Search and maintain the active employee directory.',`<button class="button" id="addEmployee">+ Add employee</button>`)}<div id="notice" class="notice" role="status"></div><section class="panel"><div class="panel-head"><div><h2>People directory</h2><div class="subtitle" id="resultCount">Loading…</div></div><div class="filters"><input id="search" type="search" placeholder="Search name, ID, email…" aria-label="Search employees"><select id="deptFilter" aria-label="Filter by department"><option value="">All departments</option>${depts.map(d=>`<option value="${esc(d.department_id)}">${esc(d.department_name)}</option>`).join('')}</select><select id="roleFilter" aria-label="Filter by role"><option value="">All roles</option>${roles.map(r=>`<option value="${esc(r.role_id)}">${esc(r.role_title)}</option>`).join('')}</select><button class="button secondary" id="searchBtn">Search</button></div></div><div class="table-wrap"><table><thead><tr><th>Employee</th><th>Department</th><th>Role</th><th>Location</th><th>Status</th><th>Actions</th></tr></thead><tbody id="peopleRows"><tr><td class="empty" colspan="6">Loading employees…</td></tr></tbody></table></div><div class="pagination"><span id="pageLabel">Loading…</span><div class="filters"><button class="button secondary" id="prev">Previous</button><button class="button secondary" id="next">Next</button></div></div></section>`}
function renderUsers(){content.innerHTML=`${head('Administration','User accounts','Create accounts for operator-approved identities, reset passwords, and deactivate access.')}<div id="userNotice" class="notice" role="status"></div><section class="panel"><div class="panel-head"><h2>Create account</h2></div><form id="userCreateForm" class="formgrid"><div class="field"><label for="userEmployeeId">Employee ID (required for Employee role)</label><input id="userEmployeeId" maxlength="20"></div><div class="field"><label for="userEmail">Email / username</label><input id="userEmail" type="email" required></div><div class="field"><label for="userRole">Role</label><select id="userRole"><option>Employee</option><option>HR</option><option>Admin</option></select></div><div class="field"><label for="userPassword">Initial password (12+ characters)</label><input id="userPassword" type="password" minlength="12" autocomplete="new-password" required></div><button class="button" id="userCreateButton">Create account</button></form><div id="userList" class="empty">Loading user accounts?</div></section>`;const notice=el('userNotice'),list=el('userList');async function loadUsers(){list.className='empty';list.textContent='Loading accounts?';try{const users=await request('/users');list.className='';list.innerHTML=users.length?`<div class="table-wrap"><table><thead><tr><th>Username</th><th>Employee</th><th>Role</th><th>Status</th><th>Created</th><th>Access</th></tr></thead><tbody>${users.map(u=>`<tr><td>${esc(u.username)}</td><td>${esc(u.employee_id||'?')}</td><td>${esc(u.role)}</td><td>${u.is_active?'Active':'Inactive'}</td><td>${esc(u.created_at)}</td><td><button class="button secondary smallbtn" data-user-id="${esc(u.user_id)}" data-active="${!u.is_active}">${u.is_active?'Deactivate':'Reactivate'}</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No user accounts have been provisioned.</div>'}catch(e){sectionError(list,e)}}el('userCreateForm').onsubmit=async e=>{e.preventDefault();const b=el('userCreateButton');b.disabled=true;notice.style.display='none';try{await request('/users',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({employee_id:el('userEmployeeId').value.trim()||null,username:el('userEmail').value,password:el('userPassword').value,role:el('userRole').value})});el('userCreateForm').reset();notice.textContent='Account created.';notice.classList.remove('error');notice.style.display='block';await loadUsers()}catch(error){notice.textContent=error.message;notice.classList.add('error');notice.style.display='block'}finally{b.disabled=false}};list.onclick=async e=>{const b=e.target.closest('[data-user-id]');if(!b)return;try{await request(`/users/${encodeURIComponent(b.dataset.userId)}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({is_active:b.dataset.active==='true'})});await loadUsers()}catch(error){sectionError(list,error)}};loadUsers()}
function render(){if(page==='users'){renderUsers();return}if(page==='dashboard'&&authUser?.role==='Employee'){content.innerHTML=`${head('My workspace',`Welcome, ${esc(authUser.username)}`,`Employee ID ${esc(authUser.employee_id||'not linked')}`)}<section class="panel"><div class="panel-head"><h2>Your LedgerForge records</h2></div><div style="padding:18px;display:flex;gap:9px;flex-wrap:wrap"><button class="button" data-shortcut="payslips">My payslips</button><button class="button secondary" data-shortcut="salary">My salary</button><button class="button secondary" data-shortcut="attendance">My attendance</button><button class="button secondary" data-shortcut="leave">My leave</button></div></section>`;content.querySelectorAll('[data-shortcut]').forEach(b=>b.onclick=()=>setPage(b.dataset.shortcut));return}if(page==='attendance'){renderAttendance();return}if(page==='leave'){renderLeave();return}if(page==='payslips'){renderPayslips();return}if(page==='ledger'){renderLedger();return}if(page==='financial-reports'){renderFinancialReports();return}if(page==='clients'||page==='invoices'){renderReceivables(page==='invoices'?'invoices':'clients');return}if(page==='people'){content.innerHTML=peoplePage();el('addEmployee').onclick=openCreate;el('searchBtn').onclick=()=>{offset=0;loadPeople()};el('search').onkeydown=e=>{if(e.key==='Enter'){offset=0;loadPeople()}};el('deptFilter').onchange=()=>{offset=0;loadPeople()};el('roleFilter').onchange=()=>{offset=0;loadPeople()};el('prev').onclick=()=>{offset=Math.max(0,offset-limit);loadPeople()};el('next').onclick=()=>{if(pageHasNext){offset+=limit;loadPeople()}};loadPeople();return}
if(page==='organisation'){content.innerHTML=`${head('Company','Organisation','Departments and roles from the organisation directory API.')}<div id="notice" class="notice" role="status"></div>${depts.length?`<div class="orggrid">${depts.map(d=>`<article class="card orgitem"><strong>${esc(d.department_name)}</strong><p>${esc(d.department_id)} · Cost centre ${esc(d.cost_center||'—')}</p><p>${esc(d.description||'Department')}</p></article>`).join('')}</div>`:'<div class="unavailable">Department data is currently unavailable.</div>'}`;return}
if(page==='salary'){content.innerHTML=`${head('Compensation','Salary history','View salary structure and revision history returned by the employee salary API.')}<div id="notice" class="notice" role="status"></div><section class="panel"><div class="panel-head"><div><h2>Employee salary</h2><div class="subtitle">Enter an employee ID and effective date.</div></div><div class="filters"><input id="salaryEmployee" placeholder="Employee ID" aria-label="Employee ID"><input id="salaryDate" type="date" aria-label="Effective date" value="${new Date().toISOString().slice(0,10)}"><button id="salaryLoad" class="button">Load salary</button></div></div><div id="salaryResult" class="empty">Salary data is private. Only look up an employee where you are authorized.</div></section>`;el('salaryLoad').onclick=async()=>{const id=el('salaryEmployee').value.trim(),date=el('salaryDate').value;if(!id||!date){toast('Enter an employee ID and effective date.',true);return}const box=el('salaryResult');box.className='empty';box.textContent='Loading salary data…';try{const [s,h]=await Promise.all([request(`/employees/${encodeURIComponent(id)}/salary?effective_date=${encodeURIComponent(date)}`),request(`/employees/${encodeURIComponent(id)}/salary/revisions`)]);box.className='';box.innerHTML=`<div style="padding:18px"><div class="metrics"><article class="card metric"><div class="metric-label">ANNUAL FIXED</div><div class="metric-value" style="font-size:20px">${money(s.annual_fixed)}</div><div class="metric-note">Effective ${esc(s.effective_date)}</div></article><article class="card metric"><div class="metric-label">COMPONENTS</div><div class="metric-value">${s.components.length}</div><div class="metric-note">API returned salary components</div></article><article class="card metric"><div class="metric-label">REVISION HISTORY</div><div class="metric-value">${h.length}</div><div class="metric-note">Recorded salary revisions</div></article></div><h2 style="margin:10px 0">Current components</h2><div class="table-wrap"><table style="min-width:450px"><thead><tr><th>Component</th><th>Type</th><th>Monthly amount</th></tr></thead><tbody>${s.components.map(c=>`<tr><td>${esc(c.component_name)}</td><td>${esc(c.component_type)}</td><td>${money(c.monthly_amount)}</td></tr>`).join('')||'<tr><td colspan="3" class="empty">No components returned for this date.</td></tr>'}</tbody></table></div><h2 style="margin:24px 0 10px">Revision history</h2><div class="table-wrap"><table style="min-width:650px"><thead><tr><th>Effective</th><th>Reason</th><th>Annual fixed</th><th>Change</th><th>Approved by</th></tr></thead><tbody>${h.map(x=>`<tr><td>${esc(x.effective_from)}</td><td>${esc(x.revision_reason)}</td><td>${money(x.new_annual_fixed)}</td><td>${x.pct_change==null?'—':esc(x.pct_change)+'%'}</td><td>${esc(x.approved_by||'—')}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">No revision history returned.</td></tr>'}</tbody></table></div></div>`}catch(e){box.className='unavailable';box.textContent=`Salary data could not be loaded: ${e.message}`}};return}
if(page==='payroll'){content.innerHTML=`${head('Payroll','Payroll preview','Calculate a monthly employee payroll preview from stored salary, attendance, and configured payroll inputs.')}<section class="panel"><div class="panel-head"><div><h2>Calculate employee payroll</h2><div class="subtitle">Requires a bearer token from your configured identity provider. The token is not saved.</div></div></div><form id="payrollForm" class="formgrid"><div class="field"><label for="payrollEmployee">Employee ID</label><input id="payrollEmployee" required autocomplete="off" placeholder="EMP-0001"></div><div class="field"><label for="payrollMonth">Payroll month</label><input id="payrollMonth" type="month" required value="${new Date().toISOString().slice(0,7)}"></div><div class="field full"><label for="payrollToken">Bearer token</label><input id="payrollToken" type="password" required autocomplete="off" spellcheck="false" placeholder="Paste your identity provider token"></div><div class="full"><button id="payrollCalculate" class="button" type="submit">Calculate preview</button></div></form><div id="payrollResult" class="empty" aria-live="polite">Configured tax and statutory values may be sample inputs.</div></section>`;el('payrollForm').onsubmit=async event=>{event.preventDefault();const id=el('payrollEmployee').value.trim(),month=el('payrollMonth').value,token=el('payrollToken').value.trim(),box=el('payrollResult'),button=el('payrollCalculate');if(!id||!month||!token)return;button.disabled=true;box.className='empty';box.textContent='Calculating…';try{const r=await request(`/payroll/calculate/${encodeURIComponent(id)}?month=${encodeURIComponent(month)}`,{headers:{Authorization:`Bearer ${token}`}});box.className='';box.innerHTML=`<div style="padding:18px"><div class="metrics"><article class="card metric"><div class="metric-label">GROSS PAY</div><div class="metric-value" style="font-size:20px">${money(r.gross_pay)}</div></article><article class="card metric"><div class="metric-label">DEDUCTIONS</div><div class="metric-value" style="font-size:20px">${money(r.total_deductions)}</div></article><article class="card metric"><div class="metric-label">NET PAY</div><div class="metric-value" style="font-size:20px">${money(r.net_pay)}</div></article></div><p class="subtitle">Overtime: ${esc(r.overtime_hours_paid)} hours · ${money(r.overtime_pay)} · Period ${esc(r.period_start)} to ${esc(r.period_end)}</p>${r.warnings?.length?`<ul>${r.warnings.map(w=>`<li class="subtitle">${esc(w)}</li>`).join('')}</ul>`:''}</div>`}catch(e){box.className='unavailable';box.textContent=`Payroll calculation failed: ${e.message}`}finally{el('payrollToken').value='';button.disabled=false}};return}
content.innerHTML=`${head('Workspace','Good day','A clear view of your people and organisation.')}<section class="metrics"><article class="card metric"><div class="metric-label">ACTIVE EMPLOYEES</div><div class="metric-value">${stats?esc(stats.active_employees):'—'}</div><div class="metric-note">${stats?'Current active directory records':'Employee stats unavailable'}</div></article><article class="card metric"><div class="metric-label">DEPARTMENTS</div><div class="metric-value">${stats?depts.length:'—'}</div><div class="metric-note">${stats?'Organisation directory':'Department data unavailable'}</div></article><article class="card metric"><div class="metric-label">PAYROLL DATA</div><div class="metric-value" style="font-size:18px">Available</div><div class="metric-note">Authenticated payroll preview</div></article></section><section class="panel"><div class="panel-head"><div><h2>Get started</h2><div class="subtitle">Open a live people and organisation view.</div></div></div><div style="padding:18px;display:flex;gap:9px;flex-wrap:wrap"><button class="button" data-shortcut="people">Employee directory</button><button class="button secondary" data-shortcut="organisation">Departments & roles</button></div></section><p class="subtitle" style="margin:17px 2px">Attendance, leave, payroll preview, payslips, the accounting ledger, clients and receivables are available to authorized users in their dashboard sections.</p>`;content.querySelectorAll('[data-shortcut]').forEach(b=>b.onclick=()=>setPage(b.dataset.shortcut))}
async function getRoles(dept=''){const q=dept?'?department_id='+encodeURIComponent(dept):'';return request('/roles'+q)}
function fillForm(e={}){el('employeeForm').reset();for(const k of ['employee_id','hire_date','first_name','last_name','full_name','work_email','employment_type','employment_status','department_id','manager_id','work_location','work_mode'])el(k).value=e[k]??'';el('department_id').innerHTML='<option value="">Select department…</option>'+depts.map(d=>`<option value="${esc(d.department_id)}">${esc(d.department_name)}</option>`).join('');el('department_id').value=e.department_id||'';return refreshRoles(e.role_id||'')}
async function refreshRoles(selected=''){const a=await getRoles(el('department_id').value);el('role_id').innerHTML='<option value="">Select role…</option>'+a.map(r=>`<option value="${esc(r.role_id)}">${esc(r.role_title)} · ${esc(r.role_id)}</option>`).join('');if(selected)el('role_id').value=selected}
function setReadonly(ro){document.querySelectorAll('#employeeForm input,#employeeForm select').forEach(x=>x.disabled=ro);el('saveEmployee').hidden=ro}
async function openCreate(){mode='create';el('formError').textContent='';await fillForm({employment_status:'Active',employment_type:'Permanent',hire_date:new Date().toISOString().slice(0,10)});el('employee_id').readOnly=false;setReadonly(false);el('dialogTitle').textContent='Add employee';el('saveEmployee').textContent='Create employee';el('employeeDialog').showModal()}
async function openEmployee(id,action){try{const e=await request('/employees/'+encodeURIComponent(id));mode=action;await fillForm(e);el('employee_id').readOnly=true;setReadonly(action==='view');if(action==='edit')el('hire_date').disabled=true;el('dialogTitle').textContent=action==='view'?'Employee details':'Edit employee';el('saveEmployee').textContent='Save changes';el('formError').textContent='';el('employeeDialog').showModal()}catch(e){toast(e.message,true)}}
async function submitEmployee(ev){ev.preventDefault();const d=Object.fromEntries(new FormData(el('employeeForm')).entries());for(const k of ['manager_id','work_location','work_mode'])d[k]=d[k]?.trim()||null;const url=mode==='create'?'/employees':'/employees/'+encodeURIComponent(d.employee_id),method=mode==='create'?'POST':'PATCH';if(mode==='edit')delete d.employee_id;try{el('saveEmployee').disabled=true;await request(url,{method,headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});el('employeeDialog').close();toast(mode==='create'?'Employee created.':'Employee updated.');await loadOverview();render()}catch(e){el('formError').textContent=e.message}finally{el('saveEmployee').disabled=false}}
async function deleteEmployee(id){try{const e=await request('/employees/'+encodeURIComponent(id));if(!confirm(`Mark ${e.full_name} as departed? This preserves the employee and their history.`))return;await request('/employees/'+encodeURIComponent(id),{method:'DELETE'});toast(`${e.full_name} marked as departed.`);await loadOverview();render()}catch(e){toast(e.message,true)}}
el('employeeForm').addEventListener('submit',submitEmployee);el('closeDialog').onclick=()=>el('employeeDialog').close();el('department_id').onchange=()=>refreshRoles().catch(e=>el('formError').textContent=e.message);['first_name','last_name'].forEach(k=>el(k).addEventListener('input',()=>{if(mode==='create')el('full_name').value=(el('first_name').value+' '+el('last_name').value).trim()}));el('content').addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(b){b.dataset.action==='delete'?deleteEmployee(b.dataset.id):openEmployee(b.dataset.id,b.dataset.action)}});document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>{if(!b.disabled){setPage(b.dataset.page);el('sidebar').classList.remove('open')}}));el('themeBtn').onclick=()=>{document.documentElement.classList.toggle('dark');localStorage.setItem('lf-theme',document.documentElement.classList.contains('dark')?'dark':'light')};if(localStorage.getItem('lf-theme')==='dark')document.documentElement.classList.add('dark');el('menuBtn').onclick=()=>el('sidebar').classList.toggle('open');
startDashboard();
</script></body></html>
